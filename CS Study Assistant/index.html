<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>CS Academic Search & Parser</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b0f19">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <h1>CS Academic Search & Parser</h1>
            <p>Smart Fallbacks & Dynamic Manual Parsing</p>
        </header>

        <div class="manual-extractor">
            <h3>📚 Course Manual Key-Point Extractor</h3>
            <textarea id="manualInput" rows="4" placeholder="Paste chapters or paragraphs from your course manual text here..."></textarea>
            <button id="parseBtn" class="action-btn">Extract & Web-Source Summary</button>
        </div>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search saved/extracted notes..." autocomplete="off">
        </div>

        <main class="cards-deck" id="resultsEngine">
            </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
